
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Students Information</title>


    <!-- =========================
         Google Font
         ========================= -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =========================
         jQuery
         ========================= -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


    <!-- =========================
         CSS
         ========================= -->

    <link rel="stylesheet" href="style.css">

</head>


<body>


    

    <div class="card">

        <h1>Students Information</h1>


     

        <div class="toolbar">


    

            <button
                class="btn add"
                id="btnAdd"
            >
                <i>+</i>
                Add New
            </button>


  

            <button
                class="btn edit"
                id="btnEdit"
                disabled
            >
                <i>&#9998;</i>
                Edit
            </button>



            <button
                class="btn remove"
                id="btnRemove"
                disabled
            >
                <i>&#10005;</i>
                Remove
            </button>

        </div>


        <!-- =========================
             Students Table
             ========================= -->

        <div class="table-wrap">

            <table>

                <!-- Table Header -->

                <thead>

                    <tr>

                        <th>
                            <input
                                type="checkbox"
                                id="checkAll"
                                aria-label="Select all"
                            >
                        </th>

                        <th>ID</th>

                        <th>Full Name</th>

                        <th>Sex</th>

                        <th>Phone Number</th>

                        <th>DOB</th>

                        <th>Email</th>

                    </tr>

                </thead>


                <!-- Table Body -->

                <tbody id="tbody">

                    <!--
                        Student rows will be
                        generated by JavaScript
                    -->

                </tbody>

            </table>

        </div>

    </div>


    <!-- ==================================================
         Add / Edit Student Modal
         ================================================== -->

    <div
        class="overlay"
        id="formModal"
    >

        <div
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
        >


            <!-- Modal Title -->

            <h2 id="modalTitle">
                Add student
            </h2>


            <!-- =========================
                 Full Name
                 ========================= -->

            <label for="fName">
                Full name
            </label>

            <input
                type="text"
                id="fName"
                autocomplete="name"
            >

            <div
                class="err"
                data-for="fName"
            ></div>


            <!-- =========================
                 Sex
                 ========================= -->

            <label for="fSex">
                Sex
            </label>

            <select id="fSex">

                <option value="">
                    Select
                </option>

                <option value="M">
                    M
                </option>

                <option value="F">
                    F
                </option>

            </select>

            <div
                class="err"
                data-for="fSex"
            ></div>


            <!-- =========================
                 Phone Number
                 ========================= -->

            <label for="fPhone">
                Phone number
            </label>

            <input
                type="tel"
                id="fPhone"
                inputmode="numeric"
                pattern="[0-9]*"
                placeholder="093857688"
            >

            <div
                class="err"
                data-for="fPhone"
            ></div>


            <!-- =========================
                 Date of Birth
                 ========================= -->

            <label for="fDob">
                Date of birth
            </label>

            <input
                type="text"
                id="fDob"
                inputmode="numeric"
                placeholder="DD-MM-YYYY"
                maxlength="10"
            >

            <div
                class="err"
                data-for="fDob"
            ></div>


            <!-- =========================
                 Email
                 ========================= -->

            <label for="fEmail">
                Email
            </label>

            <input
                type="email"
                id="fEmail"
                placeholder="name@gmail.com"
            >

            <div
                class="err"
                data-for="fEmail"
            ></div>


            <!-- =========================
                 Duplicate Alert
                 ========================= -->

            <div
                class="alert"
                id="dupAlert"
            ></div>


            <!-- =========================
                 Modal Actions
                 ========================= -->

            <div class="actions">


                <!-- Cancel -->

                <button
                    class="btn cancel"
                    id="btnCancel"
                >
                    Cancel
                </button>


                <!-- Save -->

                <button
                    class="btn save"
                    id="btnSave"
                >
                    Save
                </button>

            </div>

        </div>

    </div>


    <!-- ==================================================
         Remove Confirmation Modal
         ================================================== -->

    <div
        class="overlay"
        id="delModal"
    >

        <div
            class="modal"
            role="alertdialog"
            aria-modal="true"
        >


            <!-- Modal Title -->

            <h2>
                Remove students
            </h2>


            <!-- Delete Message -->

            <p id="delText"></p>


            <!-- =========================
                 Confirmation Buttons
                 ========================= -->

            <div class="actions">


                <!-- Keep Students -->

                <button
                    class="btn cancel"
                    id="delCancel"
                >
                    Keep
                </button>


                <!-- Confirm Remove -->

                <button
                    class="btn remove"
                    id="delConfirm"
                >
                    Remove
                </button>

            </div>

        </div>

    </div>


    <!-- =========================
         JavaScript
         ========================= -->

    <script src="script.js"></script>

</body>

</html>
